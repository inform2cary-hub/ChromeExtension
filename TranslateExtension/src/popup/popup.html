<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title data-i18n="app.name">AI Bilingual Translate</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <div class="brand">
      <span class="logo" aria-hidden="true" data-i18n="app.logo">AI</span>
      <div>
        <div class="title" data-i18n="app.name">AI Bilingual Translate</div>
        <div class="sub" id="providerLine" data-i18n="popup.loading">Loading…</div>
      </div>
    </div>
    <button type="button" class="icon-btn" id="btnOptions"
            data-i18n-title="popup.openSettings" data-i18n-aria="popup.openSettings"
            title="Open settings" aria-label="Open settings">⚙</button>
  </header>

  <button type="button" class="primary" id="btnToggle" data-i18n="popup.translate" disabled>Translate this page</button>

  <p class="status" id="status" role="status" aria-live="polite" data-i18n="popup.ready">Ready</p>

  <button type="button" class="link-btn" id="btnRetry" data-i18n="popup.retryFailed" hidden>Retry the blocks that failed</button>

  <div class="rows">
    <label class="row">
      <span data-i18n="popup.targetLang">Target language</span>
      <select id="targetLang"></select>
    </label>
    <label class="row">
      <span data-i18n="popup.style">Display style</span>
      <select id="style"></select>
    </label>
    <label class="row check">
      <input type="checkbox" id="autoHost">
      <span id="autoHostLabel">Translate this site automatically</span>
    </label>
  </div>

  <footer class="foot">
    <span><span data-i18n="popup.shortcut">Shortcut</span> <kbd>Alt</kbd>+<kbd>T</kbd></span>
    <a href="#" id="linkOptions" data-i18n="popup.allSettings">All settings</a>
  </footer>

  <script src="../lib/constants.js"></script>
  <script src="../lib/i18n.js"></script>
  <script src="../lib/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
